<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aoristos SF2025 Reports</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f7f7;
        }
        .accent-color {
            color: #84cc16;
        }
        .accent-bg {
            background-color: #84cc16;
        }
        .focus-ring-color:focus {
            box-shadow: 0 0 0 4px rgba(132, 204, 22, 0.5);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-lg bg-white rounded-xl shadow-2xl p-8 md:p-12 space-y-8 transition duration-500 ease-in-out transform hover:shadow-3xl">

        <header class="text-center border-b pb-4 border-gray-100">
            <h1 class="text-4xl md:text-5xl font-extrabold text-gray-800">
                SFレポート配信ページ
            </h1>
            <p class="mt-2 text-xl font-medium accent-color tracking-wider">
                Aoristos SF2025
            </p>
        </header>

        <section class="space-y-6">
            <p class="text-gray-600 text-center text-lg">
                ダウンロードしたい分冊レポートを選択してください。
            </p>

            <div class="flex flex-col space-y-4">
                <a href="分冊①.pdf" class="accent-bg text-white font-bold py-4 px-6 rounded-lg shadow-md hover:shadow-lg transition duration-300 ease-in-out text-center text-xl tracking-wider uppercase transform hover:scale-[1.02] active:scale-95 focus:outline-none focus-ring-color">
                    分冊①.pdf (その他)
                </a>

                <a href="分冊②.pdf" class="accent-bg text-white font-bold py-4 px-6 rounded-lg shadow-md hover:shadow-lg transition duration-300 ease-in-out text-center text-xl tracking-wider uppercase transform hover:scale-[1.02] active:scale-95 focus:outline-none focus-ring-color">
                    分冊②.pdf (言語学部門)
                </a>

                <a href="分冊③.pdf" class="accent-bg text-white font-bold py-4 px-6 rounded-lg shadow-md hover:shadow-lg transition duration-300 ease-in-out text-center text-xl tracking-wider uppercase transform hover:scale-[1.02] active:scale-95 focus:outline-none focus-ring-color">
                    分冊③.pdf (技術部門)
                </a>
            </div>
        </section>

        <footer class="pt-4 border-t border-gray-100 text-center">
            <p class="text-sm text-gray-400">
                &copy; 2025 Aoristos.
            </p>
        </footer>
    </div>
</body>
</html>
